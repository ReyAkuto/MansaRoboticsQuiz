<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <rect width="300" height="150" fill="#1e222d" rx="10"/>
  <text x="150" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">SIMBOL SKEMATIK</text>
  <!-- Lingkaran Komponen -->
  <circle cx="150" cy="80" r="38" fill="none" stroke="#546e7a" stroke-width="2"/>
  <!-- Kaki Basis (B) -->
  <line x1="60" y1="80" x2="135" y2="80" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Garis Batang Basis -->
  <line x1="135" y1="55" x2="135" y2="105" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Jalur Kolektor (C) -->
  <line x1="135" y1="65" x2="175" y2="45" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="45" x2="230" y2="45" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Jalur Emitor (E) dengan Panah Keluar -->
  <line x1="135" y1="95" x2="175" y2="115" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <polygon points="175,115 160,108 166,100" fill="#ff5252"/>
  <line x1="175" y1="115" x2="230" y2="115" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Label Pin -->
  <text x="45" y="85" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold">B</text>
  <text x="245" y="50" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold">C</text>
  <text x="245" y="120" fill="#ff5252" font-family="sans-serif" font-size="13" font-weight="bold">E</text>
</svg>