<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <rect width="400" height="180" fill="#1e222d" rx="12"/>
  <text x="200" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RANGKAIAN SERI: RESISTOR PEMBATAS ARUS LED</text>

  <!-- Sumber Tegangan +5V -->
  <circle cx="50" cy="90" r="14" fill="#10b981"/>
  <text x="50" y="94" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">+5V</text>

  <!-- Kawat ke Resistor -->
  <line x1="64" y1="90" x2="110" y2="90" stroke="#00e676" stroke-width="3"/>

  <!-- Resistor Pembatas (R = 220 Ohm) -->
  <g transform="translate(110, 90)">
    <path d="M 0,0 L 10,-15 L 20,15 L 30,-15 L 40,15 L 50,-15 L 60,15 L 70,0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
    <text x="35" y="-22" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">R = 220 Ω</text>
    <text x="35" y="32" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">(Pembatas Arus)</text>
  </g>

  <!-- Kawat ke LED -->
  <line x1="180" y1="90" x2="230" y2="90" stroke="#00e676" stroke-width="3"/>

  <!-- LED -->
  <g transform="translate(230, 90)">
    <polygon points="0,-18 0,18 24,0" fill="#ef4444"/>
    <line x1="24" y1="-18" x2="24" y2="18" stroke="#ef4444" stroke-width="3"/>
    <!-- Panah Cahaya -->
    <line x1="10" y1="-20" x2="22" y2="-32" stroke="#fef08a" stroke-width="2"/>
    <polygon points="22,-32 16,-30 20,-26" fill="#fef08a"/>
    <line x1="18" y1="-14" x2="30" y2="-26" stroke="#fef08a" stroke-width="2"/>
    <polygon points="30,-26 24,-24 28,-20" fill="#fef08a"/>
    <text x="12" y="32" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">LED</text>
  </g>

  <!-- Kawat ke GND -->
  <line x1="254" y1="90" x2="330" y2="90" stroke="#00e676" stroke-width="3"/>

  <!-- Simbol Ground (GND) -->
  <g transform="translate(330, 90)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00e676" stroke-width="3"/>
    <line x1="15" y1="-12" x2="15" y2="12" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="20" y1="-8" x2="20" y2="8" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="25" y1="-4" x2="25" y2="4" stroke="#cbd5e1" stroke-width="2"/>
    <text x="20" y="26" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">GND (0V)</text>
  </g>

  <text x="200" y="165" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="sans-serif">
    Fungsi Resistor: Mencegah arus berlebih yang dapat merusak/membakar LED
  </text>
</svg>