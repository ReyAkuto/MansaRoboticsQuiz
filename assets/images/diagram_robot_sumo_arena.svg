<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#1e222d" rx="12"/>
  <text x="200" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ARENA PERTANDINGAN ROBOT SUMO (DOHYO)</text>

  <!-- Lingkaran Luar Ring Dohyo (Garis Batas Putih) -->
  <circle cx="200" cy="115" r="80" fill="#111827" stroke="#ffffff" stroke-width="10"/>

  <!-- Garis Start di Tengah (Shikiri-sen) -->
  <line x1="180" y1="95" x2="180" y2="135" stroke="#ef4444" stroke-width="3"/>
  <line x1="220" y1="95" x2="220" y2="135" stroke="#3b82f6" stroke-width="3"/>

  <!-- Robot Merah (Kiri) -->
  <g transform="translate(150, 105)">
    <rect x="-12" y="-12" width="24" height="24" fill="#ef4444" rx="3" stroke="#fca5a5"/>
    <polygon points="12,0 8,-4 8,4" fill="#ffffff"/> <!-- Arah Hadap -->
  </g>

  <!-- Robot Biru (Kanan) -->
  <g transform="translate(250, 105)">
    <rect x="-12" y="-12" width="24" height="24" fill="#3b82f6" rx="3" stroke="#93c5fd"/>
    <polygon points="-12,0 -8,-4 -8,4" fill="#ffffff"/> <!-- Arah Hadap -->
  </g>

  <!-- Label Penjelas -->
  <text x="70" y="115" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">Garis Putih (Batas Ring)</text>
  <line x1="120" y1="115" x2="140" y2="115" stroke="#ffffff" stroke-width="1.5"/>

  <text x="200" y="205" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">
    Misi: Mendorong lawan keluar melintasi batas garis putih lingkaran
  </text>
</svg>