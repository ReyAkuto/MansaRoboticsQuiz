<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="100%" height="100%">
  <rect width="300" height="140" fill="#1e222d" rx="10"/>
  <text x="150" y="25" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIMBOL DIODA PENYEARAH</text>
  <!-- Kawat Kiri (Anoda +) -->
  <line x1="30" y1="70" x2="120" y2="70" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Segitiga Dioda -->
  <polygon points="120,40 120,100 170,70" fill="#00e676"/>
  <!-- Garis Bar Katoda (-) -->
  <line x1="170" y1="38" x2="170" y2="102" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Kawat Kanan (Katoda -) -->
  <line x1="170" y1="70" x2="270" y2="70" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Label Anoda Katoda -->
  <text x="75" y="60" fill="#81c784" font-family="sans-serif" font-size="12" text-anchor="middle">Anoda (+)</text>
  <text x="225" y="60" fill="#e57373" font-family="sans-serif" font-size="12" text-anchor="middle">Katoda (-)</text>
  <circle cx="30" cy="70" r="5" fill="#00e676"/>
  <circle cx="270" cy="70" r="5" fill="#00e676"/>
  <text x="150" y="122" fill="#b0bec5" font-family="sans-serif" font-size="12" text-anchor="middle">Mengalirkan Arus 1 Arah (Forward Bias)</text>
</svg>