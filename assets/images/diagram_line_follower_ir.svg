<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <rect width="420" height="200" fill="#1e222d" rx="12"/>
  <text x="210" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PRINSIP SENSOR INFRAMERAH (IR) LINE FOLLOWER</text>

  <!-- Sisi Kiri: Permukaan Putih (Memantulkan) -->
  <g transform="translate(30, 40)">
    <!-- Sensor Box -->
    <rect x="20" y="10" width="120" height="40" fill="#2d3748" rx="6" stroke="#4a5568"/>
    <!-- IR LED (Transmitter) -->
    <circle cx="50" cy="50" r="8" fill="#e53e3e"/>
    <text x="50" y="34" fill="#fc8181" font-size="9" text-anchor="middle" font-family="sans-serif">LED IR</text>
    <!-- Photodiode (Receiver) -->
    <circle cx="110" cy="50" r="8" fill="#3182ce"/>
    <text x="110" y="34" fill="#90cdf4" font-size="9" text-anchor="middle" font-family="sans-serif">Fotodioda</text>
    <!-- Sinar Pancar -->
    <line x1="55" y1="58" x2="75" y2="95" stroke="#fc8181" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Sinar Pantul -->
    <line x1="75" y1="95" x2="105" y2="58" stroke="#68d391" stroke-width="2.5"/>
    <polygon points="105,58 98,66 106,68" fill="#68d391"/>
    <!-- Lantai Putih -->
    <rect x="10" y="96" width="140" height="16" fill="#f7fafc" rx="3" stroke="#cbd5e0"/>
    <text x="80" y="108" fill="#2d3748" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">LANTAI PUTIH</text>
    <text x="80" y="132" fill="#68d391" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cahaya Dipantulkan</text>
  </g>

  <!-- Garis Pemisah Vertikal -->
  <line x1="210" y1="45" x2="210" y2="185" stroke="#4a5568" stroke-dasharray="4,4"/>

  <!-- Sisi Kanan: Permukaan Hitam (Menyerap) -->
  <g transform="translate(230, 40)">
    <!-- Sensor Box -->
    <rect x="20" y="10" width="120" height="40" fill="#2d3748" rx="6" stroke="#4a5568"/>
    <!-- IR LED (Transmitter) -->
    <circle cx="50" cy="50" r="8" fill="#e53e3e"/>
    <text x="50" y="34" fill="#fc8181" font-size="9" text-anchor="middle" font-family="sans-serif">LED IR</text>
    <!-- Photodiode (Receiver) -->
    <circle cx="110" cy="50" r="8" fill="#3182ce"/>
    <text x="110" y="34" fill="#90cdf4" font-size="9" text-anchor="middle" font-family="sans-serif">Fotodioda</text>
    <!-- Sinar Pancar Diserap -->
    <line x1="55" y1="58" x2="75" y2="95" stroke="#fc8181" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Tidak Ada Sinar Pantul -->
    <text x="105" y="78" fill="#e53e3e" font-size="16" font-weight="bold">✕</text>
    <!-- Garis Hitam -->
    <rect x="10" y="96" width="140" height="16" fill="#000000" rx="3" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="80" y="108" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">GARIS HITAM</text>
    <text x="80" y="132" fill="#fc8181" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cahaya Diserap</text>
  </g>
</svg>