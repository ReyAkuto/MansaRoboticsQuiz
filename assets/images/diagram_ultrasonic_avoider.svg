<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <rect width="420" height="180" fill="#1e222d" rx="12"/>
  <text x="210" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SENSOR ULTRASONIK (HC-SR04) OBSTACLE AVOIDER</text>

  <!-- Modul HC-SR04 -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="110" height="70" fill="#1e3a8a" rx="6" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Pemancar (Trigger / T) -->
    <circle cx="32" cy="35" r="20" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="32" cy="35" r="10" fill="#334155"/>
    <text x="32" y="39" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">T</text>
    <text x="32" y="86" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="sans-serif">Trigger</text>
    <!-- Penerima (Echo / R) -->
    <circle cx="78" cy="35" r="20" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="78" cy="35" r="10" fill="#334155"/>
    <text x="78" y="39" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">R</text>
    <text x="78" y="86" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="sans-serif">Echo</text>
  </g>

  <!-- Gelombang Suara Pancar (Trigger) -->
  <path d="M 160,65 A 30,30 0 0,1 160,95" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 180,55 A 45,45 0 0,1 180,105" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 200,45 A 60,60 0 0,1 200,115" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="180" y="40" fill="#38bdf8" font-size="10" font-family="sans-serif">Gelombang Suara</text>

  <!-- Rintangan / Dinding -->
  <g transform="translate(320, 35)">
    <rect x="0" y="0" width="35" height="90" fill="#ef4444" rx="4" stroke="#f87171"/>
    <text x="18" y="50" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 18 50)">RINTANGAN</text>
  </g>

  <!-- Gelombang Suara Pantul (Echo) -->
  <path d="M 270,60 A 50,50 0 0,0 270,100" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <path d="M 240,50 A 65,65 0 0,0 240,110" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="255" y="125" fill="#f59e0b" font-size="10" font-family="sans-serif">Pantulan Echo</text>

  <!-- Jarak Formula -->
  <text x="210" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">
    Jarak = (Waktu Pantul × Kecepatan Suara) / 2
  </text>
</svg>