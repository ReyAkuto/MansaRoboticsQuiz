<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="50%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6cb"/>
      <stop offset="30%" stop-color="#faeed7"/>
      <stop offset="70%" stop-color="#e8d5b5"/>
      <stop offset="100%" stop-color="#cbb592"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="160" fill="#1e222d" rx="12"/>
  <text x="200" y="28" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">RESISTOR 4 GELANG: 10 kΩ ±5%</text>

  <!-- Kaki Kiri & Kanan -->
  <rect x="25" y="76" width="90" height="8" fill="url(#leadGrad)" rx="2"/>
  <rect x="285" y="76" width="90" height="8" fill="url(#leadGrad)" rx="2"/>

  <!-- Badan Resistor -->
  <g filter="url(#shadow)">
    <path d="M 110,60 C 110,50 125,50 140,58 L 260,58 C 275,50 290,50 290,60 L 290,100 C 290,110 275,110 260,102 L 140,102 C 125,110 110,110 110,100 Z" fill="url(#bodyGrad)"/>
    <!-- Gelang 1: Cokelat (1) -->
    <rect x="135" y="55" width="14" height="50" fill="#6d4c41"/>
    <!-- Gelang 2: Hitam (0) -->
    <rect x="168" y="58" width="14" height="44" fill="#212121"/>
    <!-- Gelang 3: Oranye (x1.000 / 1k) -->
    <rect x="202" y="58" width="14" height="44" fill="#fb8c00"/>
    <!-- Gelang 4: Emas (Toleransi ±5%) -->
    <rect x="252" y="55" width="14" height="50" fill="#ffd700"/>
  </g>

  <!-- Label Penjelas -->
  <text x="142" y="126" fill="#bcaaa4" font-family="sans-serif" font-size="11" text-anchor="middle">Cokelat</text>
  <text x="175" y="126" fill="#9e9e9e" font-family="sans-serif" font-size="11" text-anchor="middle">Hitam</text>
  <text x="209" y="126" fill="#ffcc80" font-family="sans-serif" font-size="11" text-anchor="middle">Oranye</text>
  <text x="259" y="126" fill="#ffe082" font-family="sans-serif" font-size="11" text-anchor="middle">Emas</text>
  <text x="200" y="148" fill="#e0e0e0" font-family="sans-serif" font-size="12" text-anchor="middle">[ 1 ] [ 0 ] × 1.000 Ω = 10.000 Ω (10 kΩ) ±5%</text>
</svg>