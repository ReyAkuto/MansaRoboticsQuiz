<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="100%" height="100%">
  <rect width="300" height="140" fill="#1e222d" rx="10"/>
  <text x="150" y="25" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIMBOL KAPASITOR ELEKTROLIT (ELCO)</text>
  <!-- Kawat Kiri (+) -->
  <line x1="30" y1="70" x2="135" y2="70" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Plat Lurus Anoda (+) -->
  <line x1="135" y1="40" x2="135" y2="100" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Tanda Plus (+) -->
  <text x="115" y="55" fill="#ff5252" font-family="sans-serif" font-size="18" font-weight="bold">+</text>
  <!-- Plat Melengkung Katoda (-) -->
  <path d="M 165,40 A 45,45 0 0,0 165,100" fill="none" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Kawat Kanan (-) -->
  <line x1="172" y1="70" x2="270" y2="70" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30" cy="70" r="5" fill="#00e676"/>
  <circle cx="270" cy="70" r="5" fill="#00e676"/>
  <text x="150" y="122" fill="#b0bec5" font-family="sans-serif" font-size="12" text-anchor="middle">Kapasitor Polar (Memiliki Kutub Positif &amp; Negatif)</text>
</svg>