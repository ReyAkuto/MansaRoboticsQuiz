<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="100%" height="100%">
  <rect width="300" height="130" fill="#1e222d" rx="10"/>
  <text x="150" y="24" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">SIMBOL SKEMATIK</text>
  <!-- Kawat Kiri (+) -->
  <line x1="30" y1="65" x2="135" y2="65" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <!-- Plat Lurus Anoda (+) -->
  <line x1="135" y1="35" x2="135" y2="95" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Tanda Plus (+) -->
  <text x="115" y="50" fill="#ff5252" font-family="sans-serif" font-size="18" font-weight="bold">+</text>
  <!-- Plat Melengkung Katoda (-) -->
  <path d="M 165,35 A 45,45 0 0,0 165,95" fill="none" stroke="#00e676" stroke-width="5" stroke-linecap="round"/>
  <!-- Kawat Kanan (-) -->
  <line x1="172" y1="65" x2="270" y2="65" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30" cy="65" r="5" fill="#00e676"/>
  <circle cx="270" cy="65" r="5" fill="#00e676"/>
</svg>